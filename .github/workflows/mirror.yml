name: mirror-live-theme

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: registry
  cancel-in-progress: false

env:
  SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_THEME_TOKEN }}
  SHOPIFY_FLAG_STORE: ${{ vars.SHOP_DOMAIN }}

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm i -g @shopify/cli

      - name: Pull del theme live
        run: shopify theme pull --live --force --path .

      - name: Commit si hay cambios
        run: |
          git config user.name "theme-merge"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "mirror: $(date -u +%Y-%m-%d\ %H:%M) UTC"
            git pull --rebase origin main
            git push origin main
          fi