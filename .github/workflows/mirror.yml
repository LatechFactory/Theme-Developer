name: mirror-live-theme

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm i -g @shopify/cli

      - name: Obtener token
        env:
          CID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          CSEC: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: |
          TOKEN=$(curl -sf -X POST \
            "https://${{ vars.SHOP_DOMAIN }}/admin/oauth/access_token" \
            -d grant_type=client_credentials \
            -d client_id="$CID" \
            -d client_secret="$CSEC" | jq -r .access_token)

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "No se pudo obtener el token"
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          echo "SHOPIFY_CLI_THEME_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Pull del theme live
        run: |
          shopify theme pull \
            --store "${{ vars.SHOP_DOMAIN }}" \
            --live \
            --force \
            --path .

      - name: Commit si hay cambios
        run: |
          git config user.name "theme-mirror"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "mirror: $(date -u +%Y-%m-%d\ %H:%M) UTC"
            git push
          fi