name: mirror-live-theme

# Thin caller → theme-workflows-core. Triggers del store: schedule diario + manual.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: registry
  cancel-in-progress: false

jobs:
  pull:
    uses: LatechFactory/theme-workflows-core/.github/workflows/mirror.yml@main
    with:
      shop_domain: ${{ vars.SHOP_DOMAIN }}
    secrets: inherit
