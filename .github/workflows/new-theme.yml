name: new-theme

# Thin caller → theme-workflows-core. La logica vive en el repo central; aca solo
# los triggers del store (workflow_dispatch + el tool create_theme de eve) y, para
# que agent-run.yml lo siga llamando como reusable, workflow_call con outputs.

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Nombre corto del fix (ej: cart-qty)"
        required: true
      ticket:
        description: "Ticket asociado (opcional)"
        required: false
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      ticket:
        required: false
        type: string
        default: ""
    outputs:
      branch:
        description: "Branch creada"
        value: ${{ jobs.create.outputs.branch }}
      theme_id:
        description: "Theme ID creado"
        value: ${{ jobs.create.outputs.theme_id }}
      preview:
        description: "Preview link del theme"
        value: ${{ jobs.create.outputs.preview }}

permissions:
  contents: write

concurrency:
  group: registry
  cancel-in-progress: false

jobs:
  create:
    uses: LatechFactory/theme-workflows-core/.github/workflows/new-theme.yml@main
    with:
      name: ${{ inputs.name }}
      ticket: ${{ inputs.ticket }}
      shop_domain: ${{ vars.SHOP_DOMAIN }}
    secrets: inherit
