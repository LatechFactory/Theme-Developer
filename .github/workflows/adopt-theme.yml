name: adopt-theme

# Thin caller → theme-workflows-core. Triggers del store: repository_dispatch
# (theme-created, del webhook de eve) y workflow_dispatch (alta explicita). Mapea
# el theme_id (del client_payload o del input) al input de la reusable.

on:
  repository_dispatch:
    types: [theme-created]
  workflow_dispatch:
    inputs:
      theme_id:
        description: "Theme ID a adoptar (ver admin de Shopify)"
        required: true

permissions:
  contents: write

concurrency:
  group: registry
  cancel-in-progress: false

jobs:
  adopt:
    uses: LatechFactory/theme-workflows-core/.github/workflows/adopt-theme.yml@v1
    with:
      theme_id: ${{ github.event.client_payload.id || inputs.theme_id }}
      shop_domain: ${{ vars.SHOP_DOMAIN }}
    secrets: inherit
