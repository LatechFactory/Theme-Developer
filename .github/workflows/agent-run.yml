name: agent-run

# Agente de IA que resuelve una tarea sobre el theme (Fase 1, ver docs/AI-AGENT.md).
#
# Flujo: crea un theme+branch (reusa new-theme) → el agente edita los archivos
# del theme resolviendo la tarea → se commitea/pushea a la branch → push-on-commit
# deploya el diff y da el preview. El agente NO habla con Shopify: este job no
# lleva el Theme Access token (frontera de seguridad).
#
# Fase 1: disparo manual (pegás la tarea). Fase 2 (futuro) suma repository_dispatch
# desde el webhook de Jira/Trello + Agent SDK. Ver docs/AI-AGENT.md.
#
# PRERREQUISITO: cargar el secret CLAUDE_CODE_OAUTH_TOKEN en el repo (token de
# suscripción, sk-ant-oat01-, de `claude setup-token`). Si en el futuro se usa
# una API key de la consola (sk-ant-api03-), cambiar a anthropic_api_key.

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Nombre corto para la branch/theme (ej: cart-qty)"
        required: true
      task:
        description: "La tarea a resolver (título + descripción + criterios)"
        required: true
      ticket:
        description: "Ticket asociado (opcional)"
        required: false

permissions:
  contents: write

jobs:
  # (1) crea theme+branch nacido del live, reusando new-theme.
  create:
    uses: ./.github/workflows/new-theme.yml
    with:
      name: ${{ inputs.name }}
      ticket: ${{ inputs.ticket }}
    secrets: inherit

  # (2) el agente trabaja sobre esa branch. Sin token de Shopify acá.
  agent:
    needs: create
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.create.outputs.branch }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm i -g @shopify/cli        # para `shopify theme check` (linter local, sin auth)

      - name: Resolver la tarea con el agente
        # Pinear la versión actual y verificar los inputs contra el README de la action.
        uses: anthropics/claude-code-action@v1
        with:
          # El token es de suscripción (sk-ant-oat01-, de `claude setup-token`),
          # no una API key → va en claude_code_oauth_token, no en anthropic_api_key.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Fijar el modelo: el default (claude-opus-5[1m]) usa la ventana de 1M,
          # un beta que la API key puede no tener → falla con is_error y 0 uso.
          claude_args: "--model claude-sonnet-5"
          show_full_output: true   # DEBUG temporal: ver qué hace el agente
          prompt: |
            Sos un agente que resuelve tareas sobre un theme de Shopify editando
            sus archivos. Leé el CLAUDE.md del repo para las convenciones, PERO
            tené en cuenta: estás en una branch de trabajo `theme/*` (NO en main),
            y tu tarea ES editar los archivos del theme para resolver el ticket.
            La regla de CLAUDE.md "no editar los archivos del theme a mano en main"
            aplica a main y a personas, NO a vos en esta branch: acá editar el
            theme es exactamente lo que corresponde. Aplicá el cambio REALMENTE en
            los archivos con tus tools de edición; no describas solo qué harías.

            TAREA
            ${{ inputs.task }}

            REGLAS
            - Editá SOLO archivos de theme: assets, blocks, config, layout,
              locales, sections, snippets, templates. No toques .github/,
              webhook/, docs/, ni themes.json.
            - Editá el/los archivo/s donde viva el cambio, sea cual sea su tipo.
              El contenido/copy/settings del merchant (títulos, textos, orden de
              secciones) suele estar en templates/*.json y config/settings_data.json;
              el comportamiento y los estilos, en Liquid y assets. Editá el que
              corresponda, sin preferencia por tipo de archivo.
            - Mantené el cambio acotado a lo que pide el ticket: sin refactors ni
              tocar cosas no relacionadas.
            - Corré `shopify theme check` y asegurate de NO introducir errores
              nuevos.
            - NO hagas git commit ni push: de eso se encarga el workflow.
            - Si la tarea es ambigua, hacé el cambio más razonable y dejá claro
              qué asumiste.

            Al terminar, resumí qué archivos cambiaste y por qué.

      - name: Commitear y pushear el trabajo del agente
        run: |
          git config user.name "theme-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "El agente no dejó cambios en el working tree"
          else
            git commit -m "agent: ${{ inputs.name }}"
          fi

          # push del trabajo (dispara push-on-commit → deploy → preview).
          # HEAD:<branch> funciona esté o no en detached HEAD.
          git push origin "HEAD:${{ needs.create.outputs.branch }}"

      - name: Resumen
        if: always()
        run: |
          {
            echo "### Agente ejecutado"
            echo "- Theme: \`${{ needs.create.outputs.theme_id }}\`"
            echo "- Branch: \`${{ needs.create.outputs.branch }}\`"
            echo "- [Preview](${{ needs.create.outputs.preview }})"
            echo ""
            echo "El deploy del diff lo hace \`push-on-commit\` al recibir el push."
          } >> "$GITHUB_STEP_SUMMARY"
