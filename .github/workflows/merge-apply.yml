name: merge-apply

# Thin caller → theme-workflows-core. Merge real (etapa 4b). Trigger del store: manual.

on:
  workflow_dispatch:
    inputs:
      origen:
        description: "Theme ID origen (X) — de donde sale el fix (ver themes.json)"
        required: true
      destino:
        description: "Theme ID destino (A) — donde se aplica (ver themes.json)"
        required: true

permissions:
  contents: write

concurrency:
  group: registry
  cancel-in-progress: false

jobs:
  apply:
    uses: LatechFactory/theme-workflows-core/.github/workflows/merge-apply.yml@v1
    with:
      origen: ${{ inputs.origen }}
      destino: ${{ inputs.destino }}
      shop_domain: ${{ vars.SHOP_DOMAIN }}
    secrets: inherit
