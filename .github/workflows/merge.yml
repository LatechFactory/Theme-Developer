name: merge

# Thin caller → theme-workflows-core. Dry run (etapa 4a). Trigger del store: manual.

on:
  workflow_dispatch:
    inputs:
      origen:
        description: "Theme ID origen (X) — de donde sale el fix (ver themes.json)"
        required: true
      destino:
        description: "Theme ID destino (A) — donde se aplicaria (ver themes.json)"
        required: true

permissions:
  contents: read

jobs:
  dry-run:
    uses: LatechFactory/theme-workflows-core/.github/workflows/merge.yml@main
    with:
      origen: ${{ inputs.origen }}
      destino: ${{ inputs.destino }}
      shop_domain: ${{ vars.SHOP_DOMAIN }}
    secrets: inherit
