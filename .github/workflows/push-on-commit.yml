name: push-on-commit

# Thin caller → theme-workflows-core. Triggers del store: push a theme/** (deploy normal)
# y workflow_call con branch (para que agent-run.yml lo llame como reusable).

on:
  push:
    branches:
      - "theme/**"
  workflow_call:
    inputs:
      branch:
        description: "Branch a deployar (para llamadas reusable, ej. desde agent-run)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: registry
  cancel-in-progress: false

jobs:
  deploy:
    uses: LatechFactory/theme-workflows-core/.github/workflows/push-on-commit.yml@main
    with:
      branch: ${{ inputs.branch || github.ref_name }}
      shop_domain: ${{ vars.SHOP_DOMAIN }}
    secrets: inherit
